# edge จำลองสำหรับ **เครื่อง dev เท่านั้น** — สะท้อน /root/app/nginx/conf.d/darin-dev.rocketlabth.com.conf
# ของเครื่องจริง เพื่อให้ทดสอบบนเครื่องตัวเองเดินเส้นทางเดียวกับบนคลาวด์
#
# 🔴 ไฟล์นี้ **ไม่ใช่** config ของ production — ของจริงอยู่นอกรีโปที่เครื่อง 157.85.104.171
#    (นั่นคือเหตุผลที่ tasks/todo-human/002-deploy-host-setup.md ต้องให้คนลงมือ) · แก้ที่นี่ไม่มีผลกับ dev/prod
#
# ## ที่ **ตั้งใจต่างจากของจริง** เพราะเครื่องนี้ไม่มี Cloudflare
# 1. ของจริงอยู่หลัง Cloudflare **Flexible SSL** ⇒ origin เห็น request เป็น http เสมอ และ
#    ของจริงส่ง `X-Forwarded-Proto https` ลงมา · ที่นี่ส่ง `$scheme` ตามความจริง (http)
# 2. ⚠️ **ผลที่ตามมากับการล็อกอิน**: `lib/auth.ts` ตั้งคุกกี้ `secure` เมื่อ `NODE_ENV=production`
#    — บนคลาวด์ไม่มีปัญหาเพราะ *เบราว์เซอร์* คุยกับ Cloudflare เป็น https
#    แต่ถ้ายิงเข้า origin ตรง ๆ ด้วย http (หรือรัน production build ที่นี่) **เบราว์เซอร์จะทิ้งคุกกี้
#    แล้วล็อกอินไม่ติดโดยไม่มีข้อความอธิบายสักบรรทัด** ⇒ ทดสอบผ่านโดเมนจริงเสมอ
#
# ตั้งชื่อ vhost ใหม่ให้ลึกแค่ 2 ชั้นเสมอ (`darin-dev`) — Universal SSL ของ CF ครอบ wildcard ชั้นเดียว

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://host.docker.internal:30300;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
