# โปรเจกต์นี้เป็น compose stack ของตัวเอง ไม่แชร์ network กับใคร
# ขาออกสู่อินเทอร์เน็ตผ่าน edge nginx กลางที่ /root/app/nginx เท่านั้น
#   darin.rocketlabth.com -> 127.0.0.1:${APP_PORT} -> app:3000
#
# 🔴 **`name:` ห้ามหาย** — compose หาชื่อโปรเจกต์ตามลำดับ `-p` > COMPOSE_PROJECT_NAME >
#    `name:` > **ชื่อไดเรกทอรี** · working copy บนเครื่องคือ /root/app/lim/darin-backend
#    และ COMPOSE_PROJECT_NAME ไม่ได้ตั้งไว้ (วัดเอง 2026-09-17) ⇒ ถ้าบรรทัดนี้หาย
#    รอบ deploy ถัดไปจะรันเป็นโปรเจกต์ `darin-backend` สร้าง volume `darin-backend_pgdata`
#    ใหม่ แล้ว seed ลงฐานเปล่า ขณะที่ `darin_pgdata` ของจริงถูกทิ้งค้างไว้
#    (§2 ข้อ 8: ไม่มีทางถอยกลับ) · ของจริงวันนี้: project `darin` · volume `darin_pgdata`
name: darin

services:
  db:
    image: postgres:18-alpine
    container_name: darin-pg
    restart: unless-stopped
    # เพดานแรม: กันคอนเทนเนอร์เดียวลากทั้งเครื่องค้าง (เหตุการณ์ 2026-08-14)
    # แก้ไว้บนเครื่องตั้งแต่วันนั้นแต่ไม่เคยเข้ารีโป — เอาเข้ามาที่นี่ (ใบ 008)
    mem_limit: 512m
    memswap_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD ใน .env}
      POSTGRES_DB: ${POSTGRES_DB:-darin_payroll}
    volumes:
      # PG18 ย้าย PGDATA ไป /var/lib/postgresql/18/docker และประกาศ VOLUME ที่ /var/lib/postgresql
      # ถ้า mount ที่ .../data แบบเดิม (PG17) ข้อมูลจะไปลง anonymous volume แล้วหายตอน recreate
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darin} -d ${POSTGRES_DB:-darin_payroll}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ไม่ publish port ออกนอก — เข้าถึงได้เฉพาะจากใน compose network
    # เปิดชั่วคราวเวลาต้อง debug: docker compose exec db psql -U darin darin_payroll

  # รันครั้งเดียวตอนขึ้นระบบ/ตอน deploy ใหม่ แล้วจบ (app รอให้เสร็จก่อน)
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: &dburl postgresql://${POSTGRES_USER:-darin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-darin_payroll}
      GOOGLE_SHEET_LINK: ${GOOGLE_SHEET_LINK:-}
      # ว่าง = seed สุ่มรหัส owner ให้แล้วพิมพ์ใน log ครั้งเดียว
      # ถ้าตัวนี้ไม่ถูกส่งเข้า container ค่าที่ตั้งใน .env จะเงียบหายและ seed สุ่มให้แทน
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    container_name: darin-web
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1g
    environment:
      DATABASE_URL: *dburl
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      GOOGLE_SHEET_LINK: ${GOOGLE_SHEET_LINK:-}
      GOOGLE_SA_EMAIL: ${GOOGLE_SA_EMAIL:-}
      GOOGLE_SA_PRIVATE_KEY: ${GOOGLE_SA_PRIVATE_KEY:-}
    ports:
      # 🔴 **ผูกกับ loopback เท่านั้น** — เครื่องคลาวด์ตัวนี้ใช้ร่วมกับโปรเจกต์อื่น และ edge nginx
      # (`/root/app/nginx`, นอกรีโปนี้) เป็นตัวเดียวที่ควรรับ request จากภายนอก · publish
      # บน 0.0.0.0 = เปิดแอปตรงออกอินเทอร์เน็ตข้าม Cloudflare ⇒ ทั้ง TLS และ WAF ถูกข้ามเงียบ ๆ
      # · บนเครื่อง dev ที่ไม่มี edge ให้ตั้ง APP_PORT แล้วเข้า 127.0.0.1:<port> ตรง ๆ
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
